# Publish to npm with provenance, from CI rather than a laptop.
#
# Provenance is a signed, verifiable link between the tarball on npm and the
# exact commit and workflow run that built it. npm shows it as a "Provenance"
# badge on the package page. For a package that handles money and is aimed at
# people who cannot audit it themselves, that link is worth more than it costs
# to set up — it means "this is really built from that public source" is
# checkable rather than trusted.
#
# Triggered by pushing a version tag (v1.6.2), or manually. It refuses to
# publish if the tag and package.json disagree, and it runs the full suite
# first, so a release cannot skip the gates.
#
# One-time setup: add an npm automation token as the NPM_TOKEN repository
# secret (npmjs.com → Access Tokens → Generate → Automation).

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # create the GitHub Release
  id-token: write      # REQUIRED for provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The gates run again here rather than trusting that they ran on the
      # commit: a tag can point anywhere.
      - name: Run the suite
        run: npm test
      - name: Type-check
        run: npm run test:types
      - name: Lint the published package shape
        run: npx --yes publint

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # An empty Releases tab reads as abandoned regardless of how active the
      # commit log is. The notes come from CHANGELOG.md, which is already
      # written per release, so this adds no second place to maintain.
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Pull just this version's section out of the changelog.
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG section for $VERSION" > /tmp/notes.md
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md
